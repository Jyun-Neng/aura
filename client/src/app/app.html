<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-accent"
        >
          <circle cx="12" cy="12" r="10" />
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          />
          <path d="M2 12h20" />
        </svg>
      </div>
      <h2 class="brand-name glow-text">AURA</h2>
      <button
        type="button"
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        aria-label="Hide sidebar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11 19l-7-7 7-7M4 12h16" />
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-item">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="7" height="9" />
          <rect x="14" y="3" width="7" height="5" />
          <rect x="14" y="12" width="7" height="9" />
          <rect x="3" y="16" width="7" height="5" />
        </svg>
        Dashboard
      </a>

      <a routerLink="/cashflow" routerLinkActive="active-link" class="nav-item">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        Cash Ledger
      </a>

      <a routerLink="/portfolio" routerLinkActive="active-link" class="nav-item">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="6" y1="20" x2="6" y2="16" />
          <line x1="12" y1="20" x2="12" y2="10" />
          <line x1="18" y1="20" x2="18" y2="4" />
        </svg>
        Securities Ledger
      </a>

      <a routerLink="/valuation" routerLinkActive="active-link" class="nav-item">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
          <polyline points="17 6 23 6 23 12" />
        </svg>
        Asset Growth Ledger
      </a>

      <a routerLink="/charts" routerLinkActive="active-link" class="nav-item">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3v18h18" />
          <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" />
        </svg>
        Analytics
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="user-badge">Single User Mode</span>
    </div>
  </aside>

  <!-- Right Pane Container -->
  <div class="main-shell">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <button
          type="button"
          class="sidebar-toggle sidebar-toggle-header"
          (click)="toggleSidebar()"
          aria-label="Show sidebar"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 5l7 7-7 7M20 12H4" />
          </svg>
        </button>
        <div class="header-breadcrumb">
          <span class="text-secondary">Workspace</span>
          <span class="separator">/</span>
          <span class="active-crumb">Personal Wealth</span>
        </div>
      </div>
    </header>

    <!-- Content Workspace -->
    <main class="content-workspace">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<style>
  .app-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background-color: var(--bg-app);
    transition: grid-template-columns 0.2s ease;
  }

  .app-layout.sidebar-collapsed {
    grid-template-columns: 0 1fr;
  }

  .app-layout.sidebar-collapsed .sidebar {
    padding: 24px 0;
    opacity: 0;
    pointer-events: none;
  }

  .app-layout.sidebar-collapsed .sidebar-toggle-header {
    display: flex;
  }

  @media (max-width: 768px) {
    .app-layout,
    .app-layout.sidebar-collapsed {
      grid-template-columns: 1fr;
    }
    .sidebar {
      display: none !important;
    }
  }

  /* Sidebar Styling */
  .sidebar {
    background-color: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 24px;
    z-index: 100;
    overflow: hidden;
    transition:
      padding 0.2s ease,
      opacity 0.15s ease;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }

  .brand-name {
    white-space: nowrap;
  }

  .sidebar-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    margin-left: auto;
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    background-color: transparent;
    color: var(--ctp-subtext1);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .sidebar-toggle:hover {
    background-color: rgba(255, 255, 255, 0.06);
    color: var(--ctp-text);
  }

  .sidebar-toggle-header {
    display: none;
    margin-right: 16px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background-color: rgba(203, 166, 247, 0.1);
    border: 1px solid rgba(203, 166, 247, 0.2);
  }

  .brand-name {
    font-size: 1.3rem;
    font-weight: 750;
    letter-spacing: 0.1em;
    color: var(--ctp-text);
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-grow: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    color: var(--ctp-subtext1);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.2s ease;
  }

  .nav-item:hover {
    background-color: rgba(255, 255, 255, 0.04);
    color: var(--ctp-text);
    transform: translateX(2px);
  }

  .active-link {
    background-color: rgba(203, 166, 247, 0.15) !important;
    color: var(--ctp-mauve) !important;
    border-left: 3px solid var(--ctp-mauve);
    border-radius: 4px 10px 10px 4px;
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(69, 71, 90, 0.2);
  }

  .user-badge {
    font-size: 0.8rem;
    color: var(--text-secondary);
    background-color: var(--ctp-surface0);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* Main Content Shell */
  .main-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .app-header {
    height: 70px;
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-sidebar);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 32px;
  }

  .header-left {
    display: flex;
    align-items: center;
  }

  .header-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }

  .separator {
    color: var(--text-muted);
  }

  .active-crumb {
    color: var(--ctp-text);
    font-weight: 600;
  }

  .content-workspace {
    flex-grow: 1;
    overflow-y: auto;
    padding: 32px;
    background-color: var(--bg-app);
  }
</style>
